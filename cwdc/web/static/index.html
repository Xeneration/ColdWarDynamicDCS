<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ColdWarDynamic</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <div class="brand" title="Cold War Dynamic Campaign for DCS World">CWDC <span>Cold War Dynamic Campaign</span></div>
  <select id="campaign" title="Switch campaign"></select>
  <button id="btn-new" class="ghost">New campaign</button>
  <div id="clock" class="clock"></div>
  <div class="spacer"></div>
  <label class="toggle" title="Close the turn automatically when you leave the mission in DCS">
    <input type="checkbox" id="auto-ingest"> Auto-ingest
  </label>
  <button id="btn-skip" class="warn" title="Sit this 6-hour turn out: every sortie is simulated">Skip turn</button>
  <button id="btn-help" class="ghost" title="Guide and glossary">? Help</button>
</header>

<div id="banner" hidden></div>

<main>
  <div id="map"></div>
  <aside>
    <div id="next"></div>
    <nav id="tabs">
      <button data-tab="ato" class="active" title="Today's sorties">ATO</button>
      <button data-tab="mission" title="The mission you are flying">Mission</button>
      <button data-tab="war" title="Who is winning">War</button>
      <button data-tab="squadron" title="Your crews and aircraft">Squadron</button>
      <button data-tab="debrief" title="What happened last turns">Debrief</button>
      <button data-tab="news" title="News from the front">News</button>
    </nav>
    <section id="tab-ato" class="tab active"></section>
    <section id="tab-mission" class="tab"></section>
    <section id="tab-war" class="tab"></section>
    <section id="tab-squadron" class="tab"></section>
    <section id="tab-debrief" class="tab"></section>
    <section id="tab-news" class="tab"></section>
  </aside>
</main>

<dialog id="dlg-maker" class="maker">
  <form method="dialog" id="form-maker">
    <div class="mk-head">
      <h2>New campaign</h2>
      <div id="mk-theatres" class="mk-theatres"></div>
      <div id="mk-presets" class="mk-presets"></div>
    </div>
    <div class="mk-body">
      <section class="mk-left">
        <div class="mk-yearbar">
          <div class="mk-year-big" id="mk-year-big">1976</div>
          <input type="range" id="mk-year" aria-label="Year of the war">
          <select id="mk-filter" title="Which aircraft to show">
            <option value="all">All aircraft</option><option value="now">In service this year</option>
            <option value="mine">Aircraft I own</option>
          </select>
        </div>
        <div class="mk-legend">
          <span><i class="lg owned"></i>you own it</span><span><i class="lg ai"></i>AI only</span>
          <span><i class="lg standin"></i>stand-in (another DCS type flies it)</span>
          <span><i class="lg wtick"></i>weapon introduced</span>
          <span class="muted">Drag across the chart to pick the year · click a name to see its weapons</span>
        </div>
        <div id="mk-chart" class="mk-chart"></div>
      </section>
      <section class="mk-right">
        <label>Your aircraft <select id="mk-aircraft"></select></label>
        <div class="mk-toggles">
          <label class="check"><input type="checkbox" id="mk-sweden"> Sweden joins the West</label>
          <label class="check"><input type="checkbox" id="mk-mixed" checked> Mixed wing (any NATO nation, carrier types from land)</label>
          <label class="check"><input type="checkbox" id="mk-strict"> No stand-ins</label>
        </div>
        <div id="mk-preview" class="mk-preview"></div>
        <div class="mk-form">
          <label>Campaign name <input id="mk-name" value="Central Front 1976" required></label>
          <label>Your pilot's name <input id="mk-pilot" value="Player"></label>
          <label>Seed <span class="muted">(same seed, same war)</span><input id="mk-seed" type="number" value="1976"></label>
          <label class="check"><input id="mk-crisis" type="checkbox" checked> Open with the pre-war crisis</label>
          <label class="check"><input id="mk-force" type="checkbox"> Overwrite a campaign with the same name</label>
        </div>
        <p class="err" id="mk-err"></p>
        <menu>
          <button type="button" id="mk-cancel" class="ghost">Cancel</button>
          <button id="mk-go" value="ok">Create campaign</button>
        </menu>
      </section>
    </div>
  </form>
</dialog>

<dialog id="dlg-guide" class="guide">
  <div class="guide-body"></div>
  <div class="guide-foot"><span class="guide-dots"></span>
    <button class="ghost guide-prev">Back</button><button class="guide-next">Next</button></div>
</dialog>

<dialog id="dlg-help" class="help">
  <h2>Help</h2>
  <p><button id="btn-guide-again" class="ghost">Show the introduction again</button></p>
  <h3>Glossary</h3>
  <dl class="help-terms"></dl>
  <p class="muted">Dotted-underlined words anywhere in the app show their meaning when you hover them.</p>
  <form method="dialog"><menu><button>Close</button></menu></form>
</dialog>

<div id="toast" hidden></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module" src="/static/app.js"></script>
</body>
</html>
