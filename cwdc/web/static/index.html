<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ColdWarDynamic</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <div class="brand" title="Cold War Dynamic Campaign for DCS World">CWDC <span>Cold War Dynamic Campaign</span></div>
  <select id="campaign" title="Switch campaign"></select>
  <button id="btn-new" class="ghost">New campaign</button>
  <div id="clock" class="clock"></div>
  <div class="spacer"></div>
  <label class="toggle" title="Close the turn automatically when you leave the mission in DCS">
    <input type="checkbox" id="auto-ingest"> Auto-ingest
  </label>
  <button id="btn-skip" class="warn" title="Sit this 6-hour turn out: every sortie is simulated">Skip turn</button>
  <button id="btn-help" class="ghost" title="Guide and glossary">? Help</button>
</header>

<div id="banner" hidden></div>

<main>
  <div id="map"></div>
  <aside>
    <div id="next"></div>
    <nav id="tabs">
      <button data-tab="ato" class="active" title="Today's sorties">ATO</button>
      <button data-tab="mission" title="The mission you are flying">Mission</button>
      <button data-tab="war" title="Who is winning">War</button>
      <button data-tab="squadron" title="Your crews and aircraft">Squadron</button>
      <button data-tab="debrief" title="What happened last turns">Debrief</button>
      <button data-tab="news" title="News from the front">News</button>
    </nav>
    <section id="tab-ato" class="tab active"></section>
    <section id="tab-mission" class="tab"></section>
    <section id="tab-war" class="tab"></section>
    <section id="tab-squadron" class="tab"></section>
    <section id="tab-debrief" class="tab"></section>
    <section id="tab-news" class="tab"></section>
  </aside>
</main>

<dialog id="dlg-new">
  <form method="dialog" id="form-new">
    <h2>New campaign</h2>
    <p class="muted">August 1976: the Warsaw Pact attacks West Germany. You fly F-4E Phantoms for NATO.</p>
    <label>Campaign name <input name="name" value="Fulda Gap 1976" required></label>
    <label>Your pilot's name <input name="pilot" value="Player"></label>
    <label>Seed <span class="muted">(a number: the same seed gives the same war)</span><input name="seed" type="number" value="1976"></label>
    <label class="check"><input name="force" type="checkbox"> Overwrite a campaign with the same name</label>
    <p class="err" id="new-err"></p>
    <menu>
      <button value="cancel" class="ghost" formnovalidate>Cancel</button>
      <button id="new-go" value="ok">Create</button>
    </menu>
  </form>
</dialog>

<dialog id="dlg-guide" class="guide">
  <div class="guide-body"></div>
  <div class="guide-foot"><span class="guide-dots"></span>
    <button class="ghost guide-prev">Back</button><button class="guide-next">Next</button></div>
</dialog>

<dialog id="dlg-help" class="help">
  <h2>Help</h2>
  <p><button id="btn-guide-again" class="ghost">Show the introduction again</button></p>
  <h3>Glossary</h3>
  <dl class="help-terms"></dl>
  <p class="muted">Dotted-underlined words anywhere in the app show their meaning when you hover them.</p>
  <form method="dialog"><menu><button>Close</button></menu></form>
</dialog>

<div id="toast" hidden></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module" src="/static/app.js"></script>
</body>
</html>
