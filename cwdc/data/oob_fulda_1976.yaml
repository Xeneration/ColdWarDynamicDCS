# Phase 1 order of battle. Unit designations are plausible for 1976 USAFE / GSFG,
# but numbers and basing are simplified. MiG-23MLD and MiG-27K are stand-ins for the
# MiG-23M / MiG-27 of 1976 (DCS has only the later variants).
#
# Phase 1 models one crew member per airframe (the F-4E's WSO comes later).
#
# Basing: the 496th TFS (peacetime home Hahn, 119 nm from the Fulda front) has dispersed
# to Rhein-Main AB (72 nm) for the war, to keep transit times playable.
# Callsigns of NATO squadrons must be DCS western callsigns (Enfield, Springfield, Uzi,
# Colt, Dodge, Ford, Chevy, Pontiac) so the radio callsign matches the campaign one.

squadrons:
  - id: b_496tfs
    name: "496th TFS"
    side: blue
    country: USA
    aircraft_type: F-4E-45MC
    base: rheinmain
    callsign: Colt
    tasks: [CAP, Strike, CAS, BAI]
    airframes: 18
    pilots: 20
    tail_prefix: "HR 68-"
    player_squadron: true
  - id: b_23tfs
    name: "23rd TFS"
    side: blue
    country: USA
    aircraft_type: F-4E-45MC
    base: spangdahlem
    callsign: Ford
    tasks: [Strike, Interdiction, SEAD]
    sorties: 3
    airframes: 18
    pilots: 20
    tail_prefix: "SP 69-"
  - id: r_mig21_merseburg
    name: "85th Guards Fighter Regiment"
    side: red
    country: USSR
    aircraft_type: MiG-21Bis
    base: merseburg
    callsign: Sokol
    tasks: [CAP]
    airframes: 24
    pilots: 26
    tail_prefix: "Red "
  - id: r_mig23_kothen
    name: "Fighter Regiment, Köthen"
    side: red
    country: USSR
    aircraft_type: MiG-23MLD
    base: kothen
    callsign: Berkut
    tasks: [CAP]
    airframes: 18
    pilots: 20
    tail_prefix: "Red 5"
  - id: r_mig27_allstedt
    name: "Fighter-Bomber Regiment, Allstedt"
    side: red
    country: USSR
    aircraft_type: MiG-27K
    base: allstedt
    callsign: Grach
    tasks: [Strike, Interdiction]
    airframes: 18
    pilots: 20
    tail_prefix: "Red 7"

# Ground formations (Phase 2). strength = abstract combat power: a NATO brigade ~100,
# a Soviet division ~250-300. arrival_turn > 1 = reinforcement (4 turns per day).
formations:
  # NATO - V / VII Corps and German I Corps
  - {id: b_pzgrbrig4, name: "Panzergrenadierbrigade 4", side: blue, country: Germany, sector: goettingen, kind: mech, strength: 110}
  - {id: b_pzbrig5, name: "Panzerbrigade 5", side: blue, country: Germany, sector: goettingen, kind: armor, strength: 110}
  - {id: b_11acr, name: "11th Armored Cavalry Regiment", side: blue, country: USA, sector: fulda, kind: cavalry, strength: 90}
  - {id: b_3ad_1bde, name: "3rd Armored Division, 1st Brigade", side: blue, country: USA, sector: fulda, kind: armor, strength: 110}
  - {id: b_3ad, name: "3rd Armored Division (-)", side: blue, country: USA, sector: rhoen, kind: armor, strength: 180}
  - {id: b_2acr, name: "2nd Armored Cavalry Regiment", side: blue, country: USA, sector: hof, kind: cavalry, strength: 90}
