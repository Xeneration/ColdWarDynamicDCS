  - {id: b_3id, name: "3rd Infantry Division (Mech)", side: blue, country: USA, sector: auto, kind: mech, strength: 200, arrival_turn: 11}
  - {id: b_1ad, name: "1st Armored Division", side: blue, country: USA, sector: auto, kind: armor, strength: 220, arrival_turn: 15}
  - {id: b_reforger_1cd, name: "1st Cavalry Division (REFORGER)", side: blue, country: USA, sector: auto, kind: armor, strength: 200, arrival_turn: 21}
