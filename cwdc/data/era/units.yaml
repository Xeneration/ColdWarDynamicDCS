# Squadron naming per nation for generated campaigns. `{n}` is a number from `numbers`.
# `callsigns`: West squadrons must use DCS western flight callsigns so the radio callsign matches.
west_callsigns: [Enfield, Springfield, Uzi, Colt, Dodge, Ford, Chevy, Pontiac]
east_callsigns: [Sokol, Berkut, Grach, Strizh, Orel, Yastreb, Kobra, Rubin, Almaz, Granit]
