  Chaparral:  {side: west, kind: sam_short, years: [1969, 1991], name: "M48 Chaparral", nations: [USA], units: [M48 Chaparral]}
  Rapier:     {side: west, kind: sam_short, years: [1971, 1991], name: "Rapier", nations: [UK],
               units: [rapier_fsa_blindfire_radar, rapier_fsa_optical_tracker_unit, rapier_fsa_launcher]}
  Roland:     {side: west, kind: sam_short, years: [1981, 1991], name: "Roland", nations: [West Germany, France, USA],
               units: [Roland Radar, Roland ADS]}
  Patriot:    {side: west, kind: sam_long, years: [1985, 1991], name: "MIM-104 Patriot", nations: [USA, West Germany, Netherlands],
               units: [Patriot str, Patriot ECS, Patriot cp, Patriot EPP, Patriot AMG, Patriot ln, Patriot ln]}
