# Store introduction years (front-line service, rounded; game-first). Each rule's `match` regexes
# are tried in order against "<CLSID> <pydcs weapon name>" (case-insensitive); first match wins,
# so specific variants come before generic ones. Family "fuel"/"equipment" are not shown as
# weapon bars on the year slider.
weapons:
  # ------------------------------------------------------------ always available
  - {family: fuel, year: 1950, match: ['fuel', 'drop ?tank', 'gal\b', 'gallon', 'DFT-', 'PTB', '\bFPU', 'Bak-|Bak \d', 'XT_']}
  - {family: ATGM, year: 1970, match: ['BGM-?71', '\bTOW\b']}
  - {family: ATGM, year: 1976, match: ['9M114', 'Shturm']}
  - {family: equipment, year: 1950, match: ['smoke', 'practice', 'BDU', 'training', 'Mk-?106', 'MK76', 'Mk-?76', 'ASQ-T50', 'travel pod', 'cargo', 'baggage', 'pilot', 'SUU-?20', 'CATM', '\bTGM', 'Trg Round', 'dummy']}
