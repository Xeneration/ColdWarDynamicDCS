# Airframes of the 1950-1991 campaign maker (game-first: dates are front-line service in the
# European / Eastern Mediterranean theatre, rounded to the year).
#
#   name       display name
#   side       west | east
#   role       fighter | interceptor | multirole | attack | bomber | helicopter | attack_helicopter
#              | awacs | tanker | transport
#   dcs        DCS unit types, in order of preference; the first one available is used
#              (core types always are; mod types only when the mod is installed)
#   player     flyable DCS variants the player can take (if the module is owned)
#   stand_in   true when `dcs` is a different aircraft standing in for one DCS lacks
#   service    {nation: [first year, last year]} (inclusive; 1991 = still in service)
