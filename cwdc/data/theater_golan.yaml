# Campaign maker (era generator): airfields by nation and squadrons per side.
generator:
  theatre: golan
  title: "Golan Front"
  lead: {west: USA, east: Syria}
  weights: {USA: 5, UK: 1.5, France: 1, Syria: 5, USSR: 2}   # who flies most squadrons
  squadrons:
    west: {fighter: 2, strike: 2}
    east: {fighter: 3, strike: 2}
  bases:
    west:                              # the first that fits is the player's home field
      - {id: ramat_david, dcs_name: Ramat David, name: Ramat David AB, nations: [USA, UK, France]}
      - {id: megiddo, dcs_name: Megiddo, name: Megiddo, nations: [USA, UK, France]}
      - {id: haifa, dcs_name: Haifa, name: Haifa, nations: [UK, France, USA]}
      - {id: eyn_shemer, dcs_name: Eyn Shemer, name: Eyn Shemer, nations: [USA, France]}
    east:
      - {id: khalkhalah, dcs_name: Khalkhalah, name: Khalkhalah, nations: [Syria, USSR]}
      - {id: marj_ruhayyil, dcs_name: Marj Ruhayyil, name: Marj Ruhayyil, nations: [Syria]}
      - {id: damascus, dcs_name: Damascus, name: Damascus, nations: [Syria, USSR]}
      - {id: mezzeh, dcs_name: Mezzeh, name: Mezzeh, nations: [Syria]}
      - {id: al_dumayr, dcs_name: Al-Dumayr, name: Al-Dumayr, nations: [Syria, USSR]}
      - {id: sayqal, dcs_name: Sayqal, name: Sayqal, nations: [USSR, Syria]}
