# Golan Front: a fictional Cold War war on the south of the DCS Syria map, made for short missions.
# A NATO expeditionary force (US, with British and French squadrons) based in northern Israel holds
# the Golan plateau against Syria and a Soviet expeditionary force. No real war is re-enacted.
# Everything the player's squadron is sent against lies within `player_range_nm` of Ramat David,
# the home field; deeper targets (the Damascus airfields, Kiswah) are flown by the AI.
# Only the campaign maker builds wars here: squadrons are generated for the year and the
# objectives below re-equipped for it (engine.generate.adapt_theatre).
# Positions are lat/lon; airbase positions come from the DCS terrain (dcs_name must match pydcs).

name: "Golan Front"
terrain: Syria
geometry:
  dcs_terrain: Syria
  blue_side: west                      # NATO holds the plateau west of the ceasefire line
  front_shift: sector
  lands: {blue: Israel, red: Syria}
  border_note: "Pre-war ceasefire line on the Golan (the Purple Line). Everything west of it was held by NATO's host nation."
  player_range_nm: 50                  # your squadron and wing only fly missions this close to home
  advance_scale: 0.6                   # a small front: ground gains per turn at 0.6 x the usual km
start: "1976-10-05T06:00:00"
turn_hours: 6
gci:
  callsign: MAGIC
  bullseye: { name: Quneitra, latlon: [33.125, 35.824] }
crisis:
  start: "1976-10-02T06:00:00"
  turns: [8, 16]
  tension_start: 20
  headline: "Crisis on the Golan. Syrian armour is moving up from Damascus to the ceasefire line."
war_news: "Syrian and Soviet forces have crossed the ceasefire line on the Golan. NATO squadrons in northern Israel are committed to holding the plateau."

# The Golan ceasefire line, north (Mount Hermon) -> south (the Yarmouk). West of this line is NATO.
front_line:
  - [33.31, 35.78]     # 0  Mount Hermon
  - [33.26, 35.81]     # 1  Majdal Shams
  - [33.19, 35.86]     # 2  Mas'ada / Jubata
  - [33.12, 35.85]     # 3  Quneitra
  - [33.04, 35.88]     # 4
  - [32.96, 35.91]     # 5  Rafid
  - [32.87, 35.90]     # 6
  - [32.78, 35.87]     # 7  Kudne
  - [32.70, 35.84]     # 8  the Yarmouk

war_plan:
  red_main_effort: {quneitra: 0.55, rafid: 0.45}
  arrival_jitter: {red: [-2, 2], blue: [-2, 4]}

victory:
  # Syria / USSR: the front reaches the Jordan bridges, a sector breaks through, or NATO air
  # power is exhausted. NATO: hold the plateau, then a negotiated ceasefire.
  red_goals:
    - {name: "the Bnot Ya'akov bridge", latlon: [33.005, 35.628]}
    - {name: "the Arik bridge", latlon: [32.885, 35.620]}
  goal_text: "Syrian and Soviet armour has reached {city} on the Jordan. NATO has lost the Golan."
  border_name: "ceasefire line"
  breakthrough_km: 22
  air_exhausted: 0.30
  nato_hold_days: 7
  max_days: 21

sectors:
  - {id: quneitra, name: "Quneitra gap (northern Golan)", front_points: [0, 1, 2, 3, 4], terrain: 1.4,
     depots: {blue: bn_nafah, red: rn_sasa}}
  - {id: rafid, name: "Rafid gap (southern Golan)", front_points: [5, 6, 7, 8], terrain: 1.3,
     depots: {blue: bn_elal, red: rn_nawa}}

cap_stations:
  blue: [[33.08, 35.68], [32.82, 35.70]]
  red: [[33.20, 36.08], [32.92, 36.12]]

airbases:
