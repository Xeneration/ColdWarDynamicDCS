# Phase 1 theater: a small slice of the Fulda Gap, August 1976, day 1 of the war.
# Positions are lat/lon (converted to DCS map coordinates on load).
# Airbase positions come from the DCS terrain itself (dcs_name must match pydcs).

name: "Fulda Gap 1976"
terrain: GermanyCW
start: "1976-08-14T06:00:00"
turn_hours: 6

# Inner German Border (+ Czechoslovak border), north -> south. West of this line is NATO.
front_line:
  - [53.95, 10.90]
  - [53.65, 10.85]
  - [53.37, 10.62]
  - [53.15, 10.95]
  - [53.05, 11.30]
  - [52.85, 11.05]
  - [52.62, 10.85]
  - [52.40, 10.80]
  - [52.20, 10.95]
  - [52.00, 10.60]
  - [51.80, 10.62]
  - [51.58, 10.55]
  - [51.40, 10.20]
  - [51.22, 9.98]
  - [51.05, 10.00]
  - [50.90, 9.95]
  - [50.82, 10.03]
  - [50.68, 9.97]
  - [50.55, 10.05]
  - [50.42, 10.30]
  - [50.33, 10.70]
  - [50.27, 11.05]
  - [50.38, 11.45]
  - [50.32, 11.90]
  - [50.20, 12.20]
  - [49.95, 12.45]
  - [49.60, 12.55]
  - [49.30, 12.90]

# Per-campaign war plan: where the Warsaw Pact makes its main effort (formations with
# sector: main go there) and how much reinforcement arrivals slip (turns, min/max).
war_plan:
  red_main_effort: {fulda: 0.4, rhoen: 0.35, goettingen: 0.15, hof: 0.10}
  arrival_jitter: {red: [-2, 2], blue: [-2, 4]}

# How the war is won (engine.outcome).
victory:
  # Warsaw Pact: the front reaches the Main (any of these taken), a sector breaks through to
  # operational depth, or NATO air power is exhausted.
  red_goals:
    - {name: Frankfurt am Main, latlon: [50.11, 8.68]}
    - {name: Aschaffenburg, latlon: [49.97, 9.15]}
    - {name: Wuerzburg, latlon: [49.79, 9.93]}
  breakthrough_km: 100
  air_exhausted: 0.30      # NATO serviceable aircraft / establishment below this = exhausted
  # NATO: after holding nato_hold_days, every sector is back on (or beyond) the border.
  nato_hold_days: 7
  # Then a negotiated ceasefire, judged by how much of the FRG the Warsaw Pact holds.
  max_days: 21

# Front sectors: stretches of the border above (indices into front_line, 0 = north).
# terrain = defender multiplier. The ground war moves each sector's front independently.
sectors:
  - {id: goettingen, name: "Goettingen corridor", front_points: [11, 12, 13], terrain: 1.2,
     depots: {blue: bn_kassel, red: rn_nordhausen}}
  - {id: fulda, name: "Fulda Gap", front_points: [14, 15, 16, 17], terrain: 1.1,
     depots: {blue: bn_hersfeld, red: rn_eisenach}}
  - {id: rhoen, name: "Rhoen / Meiningen", front_points: [18, 19, 20], terrain: 1.3,
     depots: {blue: bn_schweinfurt, red: rn_meiningen}}
  - {id: hof, name: "Hof corridor", front_points: [21, 22, 23], terrain: 1.2,
     depots: {blue: bn_bayreuth, red: rn_plauen}}

# Barrier CAP stations, ~25-40 km behind the front.
cap_stations:
  blue: [[50.75, 9.65], [50.45, 9.85]]
  red: [[50.95, 10.55], [50.65, 10.75]]

airbases:
  - {id: hahn, dcs_name: Hahn, name: Hahn AB, side: blue}
  - {id: rheinmain, dcs_name: Frankfurt, name: Rhein-Main AB, side: blue}   # DCS calls it Frankfurt
  - {id: spangdahlem, dcs_name: Spangdahlem, name: Spangdahlem AB, side: blue}
  - {id: merseburg, dcs_name: Merseburg, name: Merseburg, side: red}
  - {id: allstedt, dcs_name: Allstedt, name: Allstedt, side: red}
  - {id: kothen, dcs_name: Kothen, name: Koethen, side: red}

