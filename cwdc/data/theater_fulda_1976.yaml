# Logistics network (Phase 2): rail heads produce supply, links carry it (capacity per
# 6 h turn), sector depots feed the formations. Every link has an interdiction target
# (rail yard or halted supply column, below in `objectives`) whose damage cuts capacity.
supply_nodes:
  # NATO
  - {id: bn_frankfurt, name: "Frankfurt rail head", side: blue, latlon: [50.11, 8.68], stock: 400, capacity: 1000, production: 230}
  - {id: bn_kassel, name: "Kassel depot", side: blue, latlon: [51.31, 9.49], stock: 150, capacity: 300}
  - {id: bn_hersfeld, name: "Bad Hersfeld supply point", side: blue, latlon: [50.87, 9.71], stock: 150, capacity: 300}
  - {id: bn_schweinfurt, name: "Schweinfurt depot", side: blue, latlon: [50.05, 10.23], stock: 150, capacity: 300}
  - {id: bn_bayreuth, name: "Bayreuth depot", side: blue, latlon: [49.95, 11.58], stock: 150, capacity: 300}
  # second-line depot: takes over a sector whose forward depot is lost (nearest friendly node)
  - {id: bn_alsfeld, name: "Alsfeld depot", side: blue, latlon: [50.75, 9.27], stock: 150, capacity: 300}
  # Warsaw Pact
  - {id: rn_leipzig, name: "Leipzig rail head", side: red, latlon: [51.34, 12.37], stock: 500, capacity: 1200, production: 330}
  - {id: rn_erfurt, name: "Erfurt rail hub", side: red, latlon: [50.98, 11.03], stock: 300, capacity: 600}
  - {id: rn_nordhausen, name: "Nordhausen depot", side: red, latlon: [51.50, 10.79], stock: 150, capacity: 300}
  - {id: rn_eisenach, name: "Eisenach depot", side: red, latlon: [50.98, 10.32], stock: 150, capacity: 300}
  - {id: rn_meiningen, name: "Meiningen depot", side: red, latlon: [50.57, 10.42], stock: 150, capacity: 300}
  - {id: rn_plauen, name: "Plauen depot", side: red, latlon: [50.50, 12.13], stock: 150, capacity: 300}
supply_links:
