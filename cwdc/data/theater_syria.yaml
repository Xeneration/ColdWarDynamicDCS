  - {id: gaziantep, dcs_name: Gaziantep, name: Gaziantep, side: blue}
  - {id: aleppo, dcs_name: Aleppo, name: Aleppo, side: red}
  - {id: kuweires, dcs_name: Kuweires, name: Kuweires, side: red}
  - {id: jirah, dcs_name: Jirah, name: Jirah, side: red}

