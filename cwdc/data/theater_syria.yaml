# Southern Flank: a fictional Cold War war on the DCS Syria map. Syria and a Soviet expeditionary
# force attack north across the Turkish border toward Iskenderun, Adana and Gaziantep; NATO holds
# with the Turkish 2nd Army, the USAF from Incirlik and the RAF from Akrotiri. No real war is
# re-enacted. Only the campaign maker builds wars here (no fixed preset): squadrons are generated
# for the year; the objectives below are re-equipped for it (engine.generate.adapt_theatre).
# Positions are lat/lon; airbase positions come from the DCS terrain (dcs_name must match pydcs).

name: "Southern Flank"
terrain: Syria
geometry:
  dcs_terrain: Syria
  blue_side: north                     # NATO (Turkey) is north of the front
  front_shift: sector                  # each sector's front moves as one block (the Hatay corner)
  lands: {blue: Turkey, red: Syria}
  border_note: "Pre-war Turkish-Syrian border. Everything north of it was Turkey (NATO)."
  blue_zones:                          # NATO ground whatever the front does: Cyprus (British bases)
    - [[35.75, 32.20], [35.75, 34.65], [34.50, 34.65], [34.50, 32.20]]
start: "1976-10-05T06:00:00"
turn_hours: 6
gci:
  callsign: MAGIC
  bullseye: { name: Kilis, latlon: [36.72, 37.12] }
crisis:
  start: "1976-10-02T06:00:00"
  turns: [8, 16]
  tension_start: 20
  headline: "Crisis on NATO's southern flank. Syrian armour and Soviet transports are massing north of Aleppo."
war_news: "Syrian and Soviet forces have crossed the Turkish border. NATO squadrons are committed to the defence of Hatay and Gaziantep."

# The Turkish-Syrian border, west (the coast) -> east. North of this line is NATO.
front_line:
  - [35.92, 35.93]     # 0  the coast at Kassab
  - [35.86, 36.04]     # 1  Yayladagi
  - [35.98, 36.18]     # 2
  - [36.12, 36.40]     # 3
  - [36.24, 36.56]     # 4  Reyhanli / Bab al-Hawa
  - [36.43, 36.62]     # 5
  - [36.63, 36.68]     # 6  the corner of Hatay
  - [36.66, 36.95]     # 7
  - [36.70, 37.20]     # 8  Kilis
  - [36.73, 37.60]     # 9
  - [36.82, 38.01]     # 10 Karkamis / Jarabulus on the Euphrates
  - [36.74, 38.45]     # 11
  - [36.70, 38.95]     # 12 Akcakale / Tal Abyad
  - [36.75, 39.50]     # 13
  - [36.85, 40.05]     # 14 Ceylanpinar / Ras al-Ayn

war_plan:
  red_main_effort: {kilis: 0.4, hatay: 0.35, euphrates: 0.15, urfa: 0.1}
  arrival_jitter: {red: [-2, 2], blue: [-2, 4]}

victory:
  # Syria / USSR: the front reaches Iskenderun, Adana or Gaziantep, a sector breaks through,
  # or NATO air power is exhausted. NATO: hold the border, then a negotiated ceasefire.
  red_goals:
    - {name: Iskenderun, latlon: [36.59, 36.17]}
    - {name: Osmaniye, latlon: [37.07, 36.25]}
    - {name: Adana, latlon: [37.00, 35.32]}
  goal_text: "Syrian and Soviet armour has reached {city}. NATO's southern flank has collapsed."
  border_name: "Turkish border"
  breakthrough_km: 100
  air_exhausted: 0.30
  nato_hold_days: 7
  max_days: 21

sectors:
  - {id: hatay, name: "Hatay / Orontes valley", front_points: [0, 1, 2, 3, 4, 5], terrain: 1.3,
     depots: {blue: bn_antakya, red: rn_idlib}}
  - {id: kilis, name: "Kilis / Aleppo axis", front_points: [6, 7, 8, 9], terrain: 1.1,
     depots: {blue: bn_gaziantep, red: rn_azaz}}
  - {id: euphrates, name: "Euphrates at Karkamis", front_points: [10, 11], terrain: 1.2,
     depots: {blue: bn_birecik, red: rn_manbij}}
  - {id: urfa, name: "Harran plain (Akcakale)", front_points: [12, 13, 14], terrain: 0.9,
     depots: {blue: bn_urfa, red: rn_ain_issa}}

cap_stations:
